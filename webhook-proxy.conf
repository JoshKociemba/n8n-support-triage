server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;
    location = /webhook/plain-ticket-created {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678;
        proxy_set_header Host localhost;
        proxy_set_header X-Triage-Webhook-Token $http_x_triage_webhook_token;
        proxy_read_timeout 150s;
    }
    location / { return 404; }
}
